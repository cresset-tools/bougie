[package]
name = "bougie-composer"
version.workspace = true
edition = "2024"
description = "Composer data model for bougie: composer-manifest plus single-file script metadata."
license = "EUPL-1.2"
repository = "https://github.com/cresset-tools/bougie"
rust-version = "1.95"
authors.workspace = true

[dependencies]
composer-manifest = { workspace = true }
composer-php-json = { workspace = true }
eyre = "0.6"
serde_json = { version = "1.0", features = ["preserve_order"] }

[lints]
workspace = true
