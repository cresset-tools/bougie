name: Website

# Builds the VitePress site (landing + /docs + /blog) on PRs and deploys
# it to the web server on pushes to main. CHANGELOG.md is in the paths
# because /docs/changelog @includes it — a release merge must redeploy.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'CHANGELOG.md'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'CHANGELOG.md'
      - '.github/workflows/website.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      # Full history so VitePress lastUpdated timestamps are real.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: npm ci
        working-directory: website
        run: npm ci

      - name: vitepress build
        working-directory: website
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: website/.vitepress/dist

  # Publishes the built site to bougie.tools by rsyncing into /srv/site
  # on the origin box, which nginx serves at the apex (see the infra repo
  # cresset-tools/infra, hosts/origin/nginx.nix). Reuses the same
  # `deploy` user + PUBLISH_SSH_KEY / PUBLISH_KNOWN_HOSTS the release
  # mirror already uses (release environment). install.sh is unaffected:
  # it's an nginx 301 redirect, not a file under /srv/site, so --delete
  # can never touch it.
  deploy:
    name: deploy to bougie.tools
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: release
    env:
      DEPLOY_HOST: origin.bougie.tools
      DEPLOY_USER: deploy
      DEPLOY_PATH: /srv/site/
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist

      - name: SSH agent + known_hosts
        env:
          PUBLISH_SSH_KEY: ${{ secrets.PUBLISH_SSH_KEY }}
          PUBLISH_KNOWN_HOSTS: ${{ secrets.PUBLISH_KNOWN_HOSTS }}
        run: |
          mkdir -m 700 -p ~/.ssh
          echo "$PUBLISH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$PUBLISH_SSH_KEY"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"

      - name: rsync site to /srv/site
        run: |
          rsync -az --delete \
            -e "ssh -o BatchMode=yes" \
            dist/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}"
